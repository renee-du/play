<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Still Life, Broken</title>
<meta name="description" content="A still life of coloured glass to break with a hammer, rearrange by hand, and fuse into a sunlit stained-glass window.">
<style>
:root{--paper:#ffffff;--icon:#b3ada6;--icon-hi:#3a3633;--wash:rgba(255,255,255,.72);--focus:#22409b;color-scheme:light}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none;outline:none}
.tools{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);display:flex;gap:2px}
.tools button{width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--wash);color:var(--icon);cursor:pointer;padding:0;transition:color .2s,background .2s}
.tools button:hover{color:var(--icon-hi);background:#f4f2ef}
.tools button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tools svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tools button[aria-pressed="false"] .on,.tools button[aria-pressed="true"] .off{display:none}
.tools button.hide{display:none}
#window:not(.hide){animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:scale(.7)}}
.veil{position:fixed;inset:0;background:var(--paper);z-index:3;transition:opacity 1.1s ease;pointer-events:none}
.veil.gone{opacity:0}
</style>
</head>
<body>
<div class="tools">

</div>

/* ------------------------------------------------------------------ input */
// one finger or a click: the hammer. two fingers, a trackpad swipe or a right-drag: turn the table. pinch: closer.
let hoverXY = null;
const cv = renderer.domElement, touches = new Map();
let tapTimer = null, tapAt = null, gesture = null, rdrag = null;
function swingAt(x, y, touch) {

  HAM.touch = touch; HAM.point.copy(hit.point); HAM.normal.copy(hit.normal);

function gestureState() { const p = [...touches.values()]; return { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2, d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) }; }
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {

addEventListener('pointermove', e => {
  if (SPIN) { if (e.pointerId !== SPIN.id) return; const now = performance.now(), dx = e.clientX - SPIN.x, d = dx * 7 / Math.max(320, Math.min(innerWidth, 900));

    if (rdrag) { orbit(-(e.clientX - rdrag.x) * .006, (e.clientY - rdrag.y) * .005); rdrag = { x: e.clientX, y: e.clientY }; return; }

const endTouch = e => {
