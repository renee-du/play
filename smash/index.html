<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Still Life, Broken</title>
<meta name="description" content="A still life of porcelain, stoneware and coloured glass to break with a hammer, piece by piece.">
<style>
:root{--paper:#ffffff;--icon:#b3ada6;--icon-hi:#3a3633;--wash:rgba(255,255,255,.72);--focus:#22409b;color-scheme:light}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none;outline:none}
.tools{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);display:flex;gap:2px}
.tools button{width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--wash);color:var(--icon);cursor:pointer;padding:0;transition:color .2s,background .2s}
.tools button:hover{color:var(--icon-hi);background:#f4f2ef}
.tools button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tools svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tools button[aria-pressed="false"] .on,.tools button[aria-pressed="true"] .off{display:none}
.veil{position:fixed;inset:0;background:var(--paper);z-index:3;transition:opacity 1.1s ease;pointer-events:none}
.veil.gone{opacity:0}
</style>
</head>

</div>
